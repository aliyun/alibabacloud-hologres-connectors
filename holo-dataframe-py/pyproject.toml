[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hologres-dataframe"
dynamic = ["version"]
description = "Lazy, pandas-style DataFrame API for Hologres"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hologres-client>=0.1.2",
    "psycopg[binary,pool]>=3.1",
    "pandas>=1.3",
    "pyarrow>=12.0",
    "alibabacloud-fc20230330>=4.7.9,<5",
]

[project.optional-dependencies]
# Kept for compatibility with existing hologres-dataframe[fc] install commands.
fc = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.dynamic]
version = {attr = "hologres.dataframe._version.__version__"}

[tool.setuptools]
packages = ["hologres.dataframe"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["build", "dist"]

[tool.ruff.lint]
# A lean, stable rule set so `ruff check` is a meaningful gate. UP (pyupgrade)
# is off because tests intentionally pass typing.List/Dict as runtime values,
# and RUF022 is off because __all__ is grouped by category, not sorted.
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
