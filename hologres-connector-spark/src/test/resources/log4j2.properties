# Spark 4.x 使用 log4j2，与 Spark 3.x 的 log4j 1.x 配置不通用。
# 与 log4j.properties 保持一致：全部日志写入 target/unit-tests.log。
rootLogger.level = INFO
rootLogger.appenderRef.file.ref = file

appender.file.type = File
appender.file.name = file
appender.file.fileName = target/unit-tests.log
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yy/MM/dd HH:mm:ss.SSS} %t %p %c{1}: %m%n

# SPARK-35997: 屏蔽 org.apache.arrow 的噪音日志
logger.apachearrow.name = org.apache.arrow
logger.apachearrow.level = WARN
